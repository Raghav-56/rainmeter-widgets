[Rainmeter]
Update=1000
DefaultUpdateDivider=60
AccurateText=1
DynamicWindowSize=1
DefaultAlwaysOnTop=2
DefaultAnchorX=100%
DefaultAnchorY=100%
DefaultDraggable=1
DefaultKeepOnScreen=1
DefaultSavePosition=1
OnRefreshAction=[!CommandMeasure Clock "ApplyView()"]
OnWakeAction=[!CommandMeasure Clock "RefreshClock()"]
ContextTitle=Open life in weeks
ContextAction=[!CommandMeasure Clock "ToggleView()"]
ContextTitle2=Super-compact view
ContextAction2=[!CommandMeasure Clock "ToggleMini()"]
ContextTitle3=Hide temporarily
ContextAction3=[!Hide]
ContextTitle4=Hide today's time
ContextAction4=[!CommandMeasure Clock "ToggleToday()"]

[Metadata]
Name=Memento Mori - Life in weeks
Information=Weeks until your chosen age-60 horizon. Open the full life calendar using the View button. Drag to move.
Version=2.2

[Variables]
BirthYear=2000
BirthMonth=1
BirthDay=1
ReferenceAge=60
ShowToday=1
TextColor=238,234,224
MutedColor=182,189,180
AccentColor=223,189,131

[Clock]
Measure=Script
ScriptFile=#@#Clock.lua
UpdateDivider=1

[TextStyle]
FontFace=Segoe UI
FontColor=#TextColor#
AntiAlias=1

[Panel]
Meter=Shape
Shape=Rectangle 0.5,0.5,303,195,12 | Fill Color 23,28,26,255 | Stroke Color 57,66,60,255 | StrokeWidth 1
W=304
H=196

[Header]
Meter=String
MeterStyle=TextStyle
X=22
Y=16
FontFace=Georgia
FontSize=12
Text=Memento mori

[ViewLink]
Meter=String
MeterStyle=TextStyle
X=242
Y=17
W=58
H=25
StringAlign=Right
FontSize=8
FontColor=#MutedColor#
SolidColor=0,0,0,1
Text=View +
LeftMouseUpAction=[!CommandMeasure Clock "ToggleView()"]
MouseOverAction=[!SetOption ViewLink FontColor #TextColor#][!UpdateMeter ViewLink][!Redraw]
MouseLeaveAction=[!SetOption ViewLink FontColor #MutedColor#][!UpdateMeter ViewLink][!Redraw]
ToolTipText=Open your life in weeks

[MiniLink]
Meter=String
MeterStyle=TextStyle
X=180
Y=17
W=42
H=25
StringAlign=Right
FontSize=8
FontColor=#MutedColor#
SolidColor=0,0,0,1
Text=Mini
LeftMouseUpAction=[!CommandMeasure Clock "ToggleMini()"]
ToolTipText=Switch to the super-compact strip

[HideLink]
Meter=String
MeterStyle=TextStyle
X=282
Y=17
W=36
H=25
StringAlign=Right
FontSize=8
FontColor=#MutedColor#
SolidColor=0,0,0,1
Text=Hide
LeftMouseUpAction=[!Hide]
ToolTipText=Hide temporarily. Press Ctrl+Alt+M to show the meter again.

[TinyRestore]
Meter=String
MeterStyle=TextStyle
X=238
Y=8
W=22
H=28
StringAlign=Right
FontSize=13
FontColor=#MutedColor#
SolidColor=0,0,0,1
Text=+
Hidden=1
LeftMouseUpAction=[!CommandMeasure Clock "SetView('compact')"]
ToolTipText=Return to the normal compact view

[Weeks]
Meter=String
MeterStyle=TextStyle
X=20
Y=44
W=258
H=54
FontFace=Georgia
FontSize=34
Text=2,036

[WeeksLabel]
Meter=String
MeterStyle=TextStyle
X=22
Y=103
FontSize=9
FontColor=#MutedColor#
Text=weeks to 60

[Today]
Meter=String
MeterStyle=TextStyle
X=282
Y=103
StringAlign=Right
FontSize=9
FontColor=#AccentColor#
Text=Today  --h --m
ToolTipText=Available day: 6 am to 10 pm. Sleep: 10 pm to 6 am. Time remaining in the current window, rounded up to whole minutes.

[Progress]
Meter=Shape
X=22
Y=128
Shape=Rectangle 0,0,260,2,1 | Fill Color 57,70,61 | StrokeWidth 0
Shape2=Rectangle 0,0,1,2,1 | Fill Color #AccentColor# | StrokeWidth 0
W=260
H=2

[Lived]
Meter=String
MeterStyle=TextStyle
X=22
Y=140
FontSize=8
FontColor=#MutedColor#
Text=--% lived

[Horizon]
Meter=String
MeterStyle=TextStyle
X=282
Y=140
StringAlign=Right
FontSize=8
FontColor=#MutedColor#
Text=60-year horizon

[WeekGrid]
Meter=Shape
X=22
Y=0
W=260
H=0
Hidden=1
Shape=Line 0,1.25,260,1.25 | StrokeWidth 2.5 | StrokeDashes 1,1 | Stroke Color 57,70,61
ToolTipText=Your life in weeks. The final mark may represent a partial week.

[Statement]
Meter=String
MeterStyle=TextStyle
X=22
Y=165
FontFace=Georgia
FontSize=12
Text=You will die.

[Uncertainty]
Meter=String
MeterStyle=TextStyle
X=22
Y=0
FontSize=9
FontColor=#MutedColor#
Hidden=1
Text=The empty weeks are not promised.

[Target]
Meter=String
MeterStyle=TextStyle
X=22
Y=0
FontSize=8
FontColor=#MutedColor#
Hidden=1
Text=Chosen horizon
